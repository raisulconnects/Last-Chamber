<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1018" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Last Chamber</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #0c1018; overflow: hidden;
      font-family: system-ui, "Segoe UI", sans-serif;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; cursor: crosshair; touch-action: none; }
    #audio-controls {
      position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 12px; background: rgba(8, 10, 16, 0.72); color: #e8ecf1; font-size: 13px;
    }
    #audio-controls button {
      font: inherit; font-weight: 700; color: #0b1117; background: #4cc9f0; border: 0; border-radius: 8px;
      padding: 6px 10px; cursor: pointer; min-height: 32px;
    }
    #audio-controls button[aria-pressed="true"] { background: #8b97a8; }
    #audio-controls input[type="range"] { width: 96px; accent-color: #4cc9f0; }
    #audio-controls span { color: #8b97a8; font-size: 11px; }
    #fullscreen[hidden] { display: none; }

    /* Phones / small windows: compact controls so they never collide with the HUD. */
    @media (max-width: 560px), (pointer: coarse) {
      #audio-controls { gap: 6px; padding: 6px; }
      #audio-controls input[type="range"], #audio-controls span { display: none; }
      #audio-controls button { min-width: 44px; min-height: 40px; padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="audio-controls">
    <button id="mute" type="button" aria-pressed="false">Sound: ON</button>
    <input id="volume" type="range" min="0" max="100" value="60" aria-label="Master volume" />
    <span>M</span>
    <button id="fullscreen" type="button" aria-label="Toggle fullscreen" hidden>Full</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
