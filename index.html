<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last Chamber</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0c1018; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    #audio-controls {
      position: fixed; top: 14px; right: 14px; display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 12px; background: rgba(8, 10, 16, 0.72); color: #e8ecf1; font-size: 13px;
      user-select: none;
    }
    #audio-controls button {
      font: inherit; font-weight: 700; color: #0b1117; background: #4cc9f0; border: 0; border-radius: 8px;
      padding: 6px 10px; cursor: pointer;
    }
    #audio-controls button[aria-pressed="true"] { background: #8b97a8; }
    #audio-controls input[type="range"] { width: 96px; accent-color: #4cc9f0; }
    #audio-controls span { color: #8b97a8; font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="audio-controls">
    <button id="mute" type="button" aria-pressed="false">Sound: ON</button>
    <input id="volume" type="range" min="0" max="100" value="60" aria-label="Master volume" />
    <span>M</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
